name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      polars: ${{ steps.dists.outputs.polars }}
      pandas: ${{ steps.dists.outputs.pandas }}
      spark: ${{ steps.dists.outputs.spark }}
      databricks: ${{ steps.dists.outputs.databricks }}
      airflow: ${{ steps.dists.outputs.airflow }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Verify the tag and every distribution version agree
        env:
          TAG: ${{ github.ref_name }}
        run: uv run --no-project python tools/versions.py check --tag "$TAG"
      - name: Build every distribution into dist/<name>/
        id: dists
        run: |
          uv build --package pipeloom -o dist/pipeloom
          for dir in plugins/pipeloom-*/; do
            name="$(basename "$dir")"
            uv build --package "$name" -o "dist/$name"
          done
          # every built plugin must have a publish job below
          known=' pipeloom-polars pipeloom-pandas pipeloom-spark pipeloom-databricks pipeloom-airflow '
          for dir in dist/pipeloom-*/; do
            name="$(basename "$dir")"
            case "$known" in
              *" $name "*) ;;
              *) echo "no publish job for $name in release.yml" >&2; exit 1 ;;
            esac
          done
          # tell the publish jobs which plugin distributions exist in this release
          for plugin in polars pandas spark databricks airflow; do
            if [ -d "dist/pipeloom-$plugin" ]; then built=true; else built=false; fi
            echo "$plugin=$built" >> "$GITHUB_OUTPUT"
          done
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md needs a dated heading '## [$version] - YYYY-MM-DD'" >&2
            exit 1
          fi
          # the section between "## [<version>]" and the next "## [" heading
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "empty CHANGELOG.md section for $version" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # One job and one GitHub environment per distribution: PyPI accepts a single pending
  # publisher per (owner, repository, workflow, environment), so plugins cannot share `pypi`
  # (ADR-0016). The core goes first because every plugin pins it. A plugin job runs only when
  # its distribution exists in this release. dist/notes.md sits outside every packages-dir.
  # A failed publish leaves the others published: fix the publisher and re-run the failed
  # jobs; skip-existing makes that safe.
  publish-pipeloom:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pipeloom/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/pipeloom/
          attestations: true
          skip-existing: true

  publish-pipeloom-polars:
    needs: [build, publish-pipeloom]
    if: needs.build.outputs.polars == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi-polars
      url: https://pypi.org/project/pipeloom-polars/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/pipeloom-polars/
          attestations: true
          skip-existing: true

  publish-pipeloom-pandas:
    needs: [build, publish-pipeloom]
    if: needs.build.outputs.pandas == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi-pandas
      url: https://pypi.org/project/pipeloom-pandas/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/pipeloom-pandas/
          attestations: true
          skip-existing: true

  publish-pipeloom-spark:
    needs: [build, publish-pipeloom]
    if: needs.build.outputs.spark == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi-spark
      url: https://pypi.org/project/pipeloom-spark/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/pipeloom-spark/
          attestations: true
          skip-existing: true

  publish-pipeloom-databricks:
    needs: [build, publish-pipeloom]
    if: needs.build.outputs.databricks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi-databricks
      url: https://pypi.org/project/pipeloom-databricks/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/pipeloom-databricks/
          attestations: true
          skip-existing: true

  publish-pipeloom-airflow:
    needs: [build, publish-pipeloom]
    if: needs.build.outputs.airflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi-airflow
      url: https://pypi.org/project/pipeloom-airflow/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/pipeloom-airflow/
          attestations: true
          skip-existing: true

  github-release:
    # after every publish job that ran; plugin jobs skipped for absent distributions do not block
    needs:
      - publish-pipeloom
      - publish-pipeloom-polars
      - publish-pipeloom-pandas
      - publish-pipeloom-spark
      - publish-pipeloom-databricks
      - publish-pipeloom-airflow
    if: >-
      ${{ !cancelled() && needs.publish-pipeloom.result == 'success'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release with the extracted notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*/*.whl dist/*/*.tar.gz --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes-file dist/notes.md

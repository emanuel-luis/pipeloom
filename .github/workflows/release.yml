name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Verify the tag and every distribution version agree
        env:
          TAG: ${{ github.ref_name }}
        run: uv run --no-project python tools/versions.py check --tag "$TAG"
      - name: Build every distribution into dist/<name>/
        run: |
          for p in pipeloom pipeloom-polars; do
            uv build --package "$p" -o "dist/$p"
          done
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md needs a dated heading '## [$version] - YYYY-MM-DD'" >&2
            exit 1
          fi
          # the section between "## [<version>]" and the next "## [" heading
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "empty CHANGELOG.md section for $version" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pipeloom/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # One step per distribution, core first; dist/notes.md is outside every packages-dir.
      # A distribution with no PyPI project needs a pending publisher (CONTRIBUTING.md). A
      # missing one fails only its own step and earlier steps stay published: fix it and re-run
      # the failed jobs, skip-existing makes that safe.
      - name: Publish pipeloom
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/pipeloom/
          attestations: true
          skip-existing: true
      - name: Publish pipeloom-polars
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/pipeloom-polars/
          attestations: true
          skip-existing: true

  github-release:
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release with the extracted notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*/*.whl dist/*/*.tar.gz --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes-file dist/notes.md

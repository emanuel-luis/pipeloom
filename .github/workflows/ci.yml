name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked --all-packages
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run lint-imports

  typecheck:
    runs-on: ubuntu-latest
    # a cold cache builds the pyspark sdist (~450 MB)
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      # pyspark and delta ship py.typed: the group installs them, so the Spark plugin is
      # checked against the real types
      - run: uv sync --locked --all-packages --group spark
      - run: uv run mypy --strict src plugins/pipeloom-polars/src plugins/pipeloom-pandas/src plugins/pipeloom-spark/src plugins/pipeloom-databricks/src

  test:
    needs: [lint]
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked --all-packages
      - run: uv run pytest -q --cov --cov-report=term-missing

  spark:
    # Not a required check yet: two green runs on main first.
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    # Classic and Connect cannot share a Python process: separate legs, in parallel. The classic
    # tests are split in two legs by module to keep each under the timeout.
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: classic-contract
            mode: classic
            args: >-
              --cov -k "not (TestClassicSparkCatalog and schema_policy)"
              plugins/pipeloom-spark/tests/test_contract_classic.py
          - leg: classic-rest
            mode: classic
            args: >-
              --cov plugins/pipeloom-spark/tests
              --ignore=plugins/pipeloom-spark/tests/test_contract_classic.py
          - leg: connect
            mode: connect
            args: -m spark_connect plugins/pipeloom-spark/tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ivy2/cache
          key: ivy-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: ivy-${{ runner.os }}-
      - run: uv sync --locked --all-packages --group spark
      # The classic contract leg leaves out the schema-policy matrix on spark_catalog: the
      # connect leg runs it on the same catalog. Coverage comes from the classic legs only.
      - name: Spark tests (${{ matrix.leg }})
        env:
          PIPELOOM_TEST_SPARK: ${{ matrix.mode }}
          ARGS: ${{ matrix.args }}
        run: eval "uv run pytest -q -p no:cacheprovider $ARGS"

  build:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv build --all-packages
      - name: Smoke test the core wheel alone in a clean venv
        run: |
          uv venv "$RUNNER_TEMP/core"
          uv pip install --python "$RUNNER_TEMP/core" dist/pipeloom-*.whl
          "$RUNNER_TEMP/core/bin/pipeloom" --version
          "$RUNNER_TEMP/core/bin/python" -m pipeloom --version
          "$RUNNER_TEMP/core/bin/pipeloom" plugins list
      - name: Smoke test every wheel together in a second clean venv
        run: |
          uv venv "$RUNNER_TEMP/all"
          uv pip install --python "$RUNNER_TEMP/all" dist/*.whl
          "$RUNNER_TEMP/all/bin/pipeloom" plugins list --check
          cp -r tests/fixtures/smoke "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/all/bin/pipeloom" run --project-dir "$RUNNER_TEMP/smoke" --target polars
          cp -r tests/fixtures/smoke-pandas "$RUNNER_TEMP/smoke-pandas"
          "$RUNNER_TEMP/all/bin/pipeloom" run --project-dir "$RUNNER_TEMP/smoke-pandas" --target pandas
      - name: Check package metadata
        run: uvx twine check --strict dist/*

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv run --group docs mkdocs build --strict

  diagrams:
    name: diagrams (D2 render check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # the pinned D2 release, checked against its sha256 in the Makefile
      - run: make d2-install
      - run: make diagrams-check
      - name: Upload the rendered SVGs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagrams
          path: docs/diagrams/*.svg
          if-no-files-found: warn
          retention-days: 7

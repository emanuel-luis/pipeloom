name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked --all-packages
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run lint-imports
      - run: uv run python tools/versions.py check

  typecheck:
    runs-on: ubuntu-latest
    # a cold cache builds the pyspark sdist (~450 MB)
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      # pyspark and delta ship py.typed: the group installs them, so the Spark plugin is
      # checked against the real types
      # and so does Airflow, for the Airflow plugin
      - run: uv sync --locked --all-packages --group spark --group airflow
      - run: uv run mypy --strict src plugins/pipeloom-polars/src plugins/pipeloom-pandas/src plugins/pipeloom-spark/src plugins/pipeloom-databricks/src plugins/pipeloom-airflow/src plugins/pipeloom-openlineage/src plugins/pipeloom-duckdb/src tests/typing/authoring_sample.py

  test:
    needs: [lint]
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked --all-packages
      - run: uv run pytest -q --cov --cov-report=term-missing

  perf:
    # Wall-clock budgets for a synthetic 1,000-model project (tests/perf). One job, one OS: timing
    # on a shared matrix cell is noise. Raise PIPELOOM_TEST_PERF_BUDGET_SCALE only with a reason.
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-packages
      - run: uv run pytest -q -s -p no:cacheprovider tests/perf
        env:
          PIPELOOM_TEST_PERF: "1"

  polars-floor:
    # The oldest polars the plugin declares (>=1.30), outside the lock, which resolves 2.x.
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked --all-packages
      - run: uv run --with polars==1.30.0 pytest -q -p no:cacheprovider plugins/pipeloom-polars/tests

  spark:
    # Not a required check yet: two green runs on main first.
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    # Classic and Connect cannot share a Python process: separate legs, in parallel. The classic
    # tests are split in two legs by module to keep each under the timeout.
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: classic-contract
            mode: classic
            args: >-
              --cov -k "not (TestClassicSparkCatalog and schema_policy)"
              plugins/pipeloom-spark/tests/test_contract_classic.py
          - leg: classic-rest
            mode: classic
            args: >-
              --cov plugins/pipeloom-spark/tests
              --ignore=plugins/pipeloom-spark/tests/test_contract_classic.py
          - leg: connect
            mode: connect
            args: -m spark_connect plugins/pipeloom-spark/tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      # Spark 4 resolves --packages (the Delta jar) into ~/.ivy2.5.2, not ~/.ivy2; caching it
      # spares every leg a Maven Central download that sometimes fails with "not found".
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ivy2.5.2
          key: ivy-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: ivy-${{ runner.os }}-
      - run: uv sync --locked --all-packages --group spark
      # The classic contract leg leaves out the schema-policy matrix on spark_catalog: the
      # connect leg runs it on the same catalog. Coverage comes from the classic legs only.
      - name: Spark tests (${{ matrix.leg }})
        env:
          PIPELOOM_TEST_SPARK: ${{ matrix.mode }}
          ARGS: ${{ matrix.args }}
        run: eval "uv run pytest -q -p no:cacheprovider $ARGS"

  duckdb-extensions:
    # The DuckDB plugin tests with the delta extension preinstalled into a pinned directory, then
    # run without network: Linux cuts it with a network namespace; macOS and Windows rely on the
    # engine never installing (install_extensions off, autoinstall off). One leg per OS, so the
    # Delta read test runs on all three (ADR-0051).
    needs: [lint]
    name: duckdb extensions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      UV_PYTHON: "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked --all-packages
      - name: Preinstall the delta extension (network)
        run: |
          echo "PIPELOOM_TEST_DUCKDB_EXTENSIONS=$RUNNER_TEMP/duckdb-ext" >> "$GITHUB_ENV"
          uv run --no-sync python -c "import duckdb, sys; duckdb.connect(config={'extension_directory': sys.argv[1]}).install_extension('delta')" "$RUNNER_TEMP/duckdb-ext"
      - name: DuckDB plugin tests without network (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --net --map-root-user .venv/bin/python -m pytest -q -p no:cacheprovider plugins/pipeloom-duckdb/tests
      - name: DuckDB plugin tests, nothing installs (macOS, Windows)
        if: runner.os != 'Linux'
        run: uv run --no-sync pytest -q -p no:cacheprovider plugins/pipeloom-duckdb/tests

  airflow:
    # Not a required check yet: two green runs on main first. Airflow gets a throwaway home and
    # a sqlite database under $RUNNER_TEMP; the test conftest refuses anything else.
    needs: [lint]
    name: airflow (${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        leg: [latest, af33, floor]
    env:
      UV_PYTHON: "3.12"
      PIPELOOM_TEST_AIRFLOW: "1"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Throwaway Airflow home
        run: |
          echo "AIRFLOW_HOME=$RUNNER_TEMP/airflow-home" >> "$GITHUB_ENV"
          echo "AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:///$RUNNER_TEMP/airflow-home/airflow.db" >> "$GITHUB_ENV"
      - name: Airflow tests (locked latest)
        if: matrix.leg == 'latest'
        run: |
          uv sync --locked --all-packages --group airflow
          uv run pytest -q -p no:cacheprovider plugins/pipeloom-airflow/tests --cov
      # Outside the lock: the oldest supported Airflow on the oldest supported Python (floor), and the 3.3 line
      # (af33).
      - name: Airflow tests (3.2.2 floor)
        if: matrix.leg == 'floor'
        run: |
          uv venv "$RUNNER_TEMP/af-floor" --python 3.11
          # The DATABRICKS-mode render tests need the Databricks plugin (and its Spark plugin,
          # without the pyspark extra); KUBERNETES mode needs the cncf provider; the lineage
          # facets test needs the OpenLineage plugin and provider.
          uv pip install --python "$RUNNER_TEMP/af-floor" -e . -e plugins/pipeloom-airflow \
            -e plugins/pipeloom-polars -e plugins/pipeloom-spark -e plugins/pipeloom-databricks \
            -e plugins/pipeloom-openlineage -e plugins/pipeloom-pandas \
            "apache-airflow==3.2.2" "apache-airflow-providers-cncf-kubernetes>=10.25,<11" \
            "apache-airflow-providers-openlineage>=2.8,<3" \
            pytest pytest-timeout hypothesis
          "$RUNNER_TEMP/af-floor/bin/python" -m pytest -q -p no:cacheprovider \
            plugins/pipeloom-airflow/tests -m "not airflow_e2e"
      - name: Airflow tests (3.3 line)
        if: matrix.leg == 'af33'
        run: |
          uv venv "$RUNNER_TEMP/af-33" --python 3.12
          uv pip install --python "$RUNNER_TEMP/af-33" -e . -e plugins/pipeloom-airflow \
            -e plugins/pipeloom-polars -e plugins/pipeloom-spark -e plugins/pipeloom-databricks \
            -e plugins/pipeloom-openlineage -e plugins/pipeloom-pandas \
            "apache-airflow>=3.3,<3.4" "apache-airflow-providers-cncf-kubernetes>=10.25,<11" \
            "apache-airflow-providers-openlineage>=2.8,<3" \
            pytest pytest-timeout hypothesis
          "$RUNNER_TEMP/af-33/bin/python" -m pytest -q -p no:cacheprovider \
            plugins/pipeloom-airflow/tests -m "not airflow_e2e"

  build:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv build --all-packages
      - name: Smoke test the core wheel alone in a clean venv
        run: |
          uv venv "$RUNNER_TEMP/core"
          uv pip install --python "$RUNNER_TEMP/core" dist/pipeloom-*.whl
          "$RUNNER_TEMP/core/bin/pipeloom" --version
          "$RUNNER_TEMP/core/bin/python" -m pipeloom --version
          "$RUNNER_TEMP/core/bin/pipeloom" plugins list
      - name: Smoke test every wheel together in a second clean venv
        run: |
          uv venv "$RUNNER_TEMP/all"
          uv pip install --python "$RUNNER_TEMP/all" dist/*.whl
          "$RUNNER_TEMP/all/bin/pipeloom" plugins list --check
          cp -r tests/fixtures/smoke "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/all/bin/pipeloom" run --project-dir "$RUNNER_TEMP/smoke" --target polars
          cp -r tests/fixtures/smoke-pandas "$RUNNER_TEMP/smoke-pandas"
          "$RUNNER_TEMP/all/bin/pipeloom" run --project-dir "$RUNNER_TEMP/smoke-pandas" --target pandas
      - name: Run the engine conformance kit against polars from outside the repository
        # Only the two wheels and pytest, in a directory with no pyproject.toml: what a
        # third-party engine author's CI does (docs/plugins/writing-an-engine.md).
        run: |
          uv venv "$RUNNER_TEMP/kit"
          uv pip install --python "$RUNNER_TEMP/kit" dist/pipeloom-*.whl dist/pipeloom_polars-*.whl pytest
          mkdir "$RUNNER_TEMP/kit-project"
          cp plugins/pipeloom-polars/tests/test_contract.py "$RUNNER_TEMP/kit-project/polars_harness.py"
          cd "$RUNNER_TEMP/kit-project"
          "$RUNNER_TEMP/kit/bin/pytest" -p pipeloom.testing.pytest_plugin --pipeloom-harness polars_harness:harness
      - name: Check package metadata
        run: uvx twine check --strict dist/*

  demo:
    name: demo (${{ matrix.os }})
    needs: [lint]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv build --package pipeloom && uv build --package pipeloom-duckdb
      # Only the two built wheels, in a fresh venv: what `uvx --from "pipeloom[duckdb]"` installs.
      - name: pipeloom demo in a clean venv
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/demo-venv"
          uv pip install --python "$RUNNER_TEMP/demo-venv" dist/pipeloom-*.whl dist/pipeloom_duckdb-*.whl
          cd "$RUNNER_TEMP"
          if [ -d "$RUNNER_TEMP/demo-venv/Scripts" ]; then BIN="$RUNNER_TEMP/demo-venv/Scripts"; else BIN="$RUNNER_TEMP/demo-venv/bin"; fi
          "$BIN/pipeloom" demo demo-out
          test -f demo-out/target/docs/index.html

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      # --all-packages: the CLI reference imports the Databricks plugin's commands
      - run: uv run --all-packages --group docs mkdocs build --strict

  diagrams:
    name: diagrams (D2 render check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the pinned D2 release, checked against its sha256 in the Makefile
      - run: make d2-install
      - run: make diagrams-check
      - name: Upload the rendered SVGs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagrams
          path: docs/diagrams/*.svg
          if-no-files-found: warn
          retention-days: 7

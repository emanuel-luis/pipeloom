name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: pipeloom version
      description: Output of `pipeloom --version`.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python version and OS
    validations:
      required: true

# yaml-language-server: $schema=https://emanuel-luis.github.io/pipeloom/latest/schema/v1/project.json
config_version: 1
name: {{name}}
# Settings by model folder: `+key` applies to every model below that folder.
models:
  +materialized: table
  bronze:
    +schema: bronze
    +tags: [bronze]
  silver:
    +schema: silver
    +tags: [silver]
  gold:
    +schema: gold
    +tags: [gold]
# Replace the sample data with your own. A model parameter named like a table binds to it.
sources:
  raw:
    format: csv
    location: data
    tables:
      orders:
        location: orders.csv
targets:
  dev:
    engine:
      kind: duckdb
    # Every table lives in one DuckDB file; nothing to install or start.
    catalog:
      kind: duckdb
      path: target/warehouse.duckdb
    state:
      kind: json
      path: .pipeloom/state

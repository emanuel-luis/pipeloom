files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    python_paths:
    - src
    - .
    boundary: task
    targets:
      dev:
        engine:
          kind: memory
        state:
          kind: sqlite
  models/m.py: |
    from pipeloom import model


    @model
    def a(ctx):
        return ctx.sql("select 1")

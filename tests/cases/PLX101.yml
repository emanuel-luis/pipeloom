files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    python_paths: [src]
    model_paths:
    - src
    targets:
      dev:
        engine:
          kind: memory
        catalog:
          kind: memory
  src/m.py: |
    from pipeloom import model

    @model(
        name="a",
    )
    def boom(ctx):
        raise ValueError("boom")
run: true

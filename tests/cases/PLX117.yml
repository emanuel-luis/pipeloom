cli:
  - runs
  - ls
plugins:
  - tests.plugins.fakes:NOLIST
files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    targets:
      dev:
        engine:
          kind: memory
        catalog:
          kind: memory
        state:
          kind: nolist
  models/m.py: |
    from pipeloom import model


    @model
    def a(ctx):
        return ctx.sql("select 1 as x")

plugins: ["pipeloom_databricks.spec:RENDERER_SPEC"]
render:
  pipeline: main
  max_tasks: 3
files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    engine:
      kind: memory
    catalog:
      kind: memory
    deploy:
      kind: databricks
    targets:
      dev: {}
  models/m.py: |
    from pipeloom import model


    @model
    def a(ctx):
        return ctx.sql("select 1 as x")


    @model
    def b(ctx):
        return ctx.sql("select 1 as x")


    @model
    def c(ctx):
        return ctx.sql("select 1 as x")

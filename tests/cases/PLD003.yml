plugins: ["pipeloom_databricks.spec:RENDERER_SPEC"]
render:
  pipeline: main
files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    engine:
      kind: memory
    catalog:
      kind: memory
    deploy:
      kind: databricks
      task_grouping: by_folder
    targets:
      dev: {}
  models/a/a.py: |
    from pipeloom import model


    @model
    def a1(ctx):
        return ctx.sql("select 1 as x")


    @model
    def a2(ctx, b1):
        return ctx.sql("select x from b1")
  models/b/b.py: |
    from pipeloom import model


    @model
    def b1(ctx, a1):
        return ctx.sql("select x from a1")

plugins: ["pipeloom_databricks.spec:RENDERER_SPEC"]
render: {pipeline: main}
files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    engine: {kind: memory}
    catalog: {kind: memory}
    deploy: {kind: databricks, task_grouping: by_folder}
    targets:
      dev: {}
  models/a/a.yml: |
    models:
      - {name: a1, sql: select 1 as x}
      - name: a2
        sql: select x from b1
        inputs: {b1: {ref: b1}}
  models/b/b.yml: |
    models:
      - name: b1
        sql: select x from a1
        inputs: {a1: {ref: a1}}

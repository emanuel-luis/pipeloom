run:
  hard_stop_on_start: true
files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    python_paths: [src]
    targets:
      dev:
        engine:
          kind: memory
        catalog:
          kind: memory
        naming:
          kind: none
  models/m.yml: |
    models:
      - name: a
        python: "m:hang"
      - name: b
        sql: select * from a
        inputs:
          a:
            ref: a
  src/m.py: |
    def hang(ctx):
        import time

        time.sleep(2)

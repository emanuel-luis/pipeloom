run:
  hard_stop_on_start: true
files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    python_paths:
    - src
    - .
    model_paths:
    - models
    - src
    targets:
      dev:
        engine:
          kind: memory
        catalog:
          kind: memory
        naming:
          kind: none
  models/m.py: |
    from pipeloom import model


    @model
    def b(ctx, a):
        return ctx.sql("select * from a")
  src/m.py: |
    from pipeloom import model

    @model(
        name="a",
    )
    def hang(ctx):
        import time

        time.sleep(2)

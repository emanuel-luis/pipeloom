files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    targets:
      dev:
        engine:
          kind: memory
  models/m.py: |
    from pipeloom import model


    @model
    def stg_orders(ctx):
        return ctx.sql("select 1 as id")
  models/_properties.yml: |
    models:
      - name: stg_orders
        description: One row per order.
      - name: stg_ordrs
        description: A typo.
  models/more/_properties.yml: |
    models:
      - name: stg_orders
        config:
          retries: 2

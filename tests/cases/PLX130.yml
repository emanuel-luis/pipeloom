cli: [diff, a, --state, "{project_dir}/state"]
setup:
  - [compile, --stable, --out, state/manifest.json]
files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    targets:
      dev:
        engine:
          kind: memory
        catalog:
          kind: memory
  models/m.py: |
    from pipeloom import model


    @model
    def a(ctx):
        return ctx.sql("select 1 as x")

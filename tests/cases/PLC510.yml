files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    python_paths: [src]
    model_paths:
    - src
    targets:
      dev:
        engine:
          kind: nosql
  src/m.py: |
    from pipeloom import model

    @model(
        expectations=[{"name": "x_set", "check": {"not_null": ["x"]}, "on_violation": "warn"}],
    )
    def a(ctx):
        return None
plugins: ["tests.plugins.fakes:NOSQL"]

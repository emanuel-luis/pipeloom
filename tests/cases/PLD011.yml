cli: [finalize, --run-id=case, --target=ci, "--unit-states={project_dir}/states.json"]
files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    targets:
      ci:
        engine: {kind: memory}
        catalog: {kind: memory}
  models/m.yml: |
    models:
      - {name: a, sql: select 1 as x}
  states.json: |
    {"schema": "pipeloom.unit_states/1", "units": {"a": {"status": "failed", "code": "PLD011", "message": "task a ended without a unit result: the cluster was lost"}}}

  models/m.py: |
    from pipeloom import model


    @model(
        materialized="ephemeral",
        data_tests=[{"name": "id_set", "check": {"not_null": ["id"]}}],
    )
    def a(ctx):
        return ctx.sql("select 1 as id")


    @model(
        data_tests=[{"name": "b_in_c", "check": {"relationships": {"column": "id", "to": {"ref": "c"}, "field": "id"}}}],
    )
    def b(ctx, a):
        return ctx.sql("select id from a")


    @model
    def c(ctx, b):
        return ctx.sql("select id from b")


    @model(
        data_tests=[{"name": "d_in_d", "check": {"relationships": {"column": "id", "to": {"ref": "d"}, "field": "id"}}}],
    )
    def d(ctx):
        return ctx.sql("select 1 as id")


    @model(
        materialized="intermediate",
    )
    def i(ctx):
        return ctx.sql("select 1 as id")


    @model(
        data_tests=[{"name": "e_in_i", "check": {"relationships": {"column": "id", "to": {"ref": "i"}, "field": "id"}}}],
    )
    def e(ctx):
        return ctx.sql("select 1 as id")


    @model(
        data_tests=[{"name": "g_in_h", "check": {"relationships": {"column": "id", "to": {"ref": "h"}, "field": "id"}}}],
    )
    def g(ctx):
        return ctx.sql("select 1 as id")


    @model(
        data_tests=[{"name": "h_in_k", "check": {"relationships": {"column": "id", "to": {"ref": "k"}, "field": "id"}}}],
    )
    def h(ctx):
        return ctx.sql("select 1 as id")


    @model
    def k(ctx, g):
        return ctx.sql("select id from g")

files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    python_paths:
    - src
    - .
    targets:
      dev:
        engine:
          kind: memory
        catalog:
          kind: memory
        naming:
          kind: none
  models/m.py: |
    from pipeloom import model


    @model(
        expectations=[{"name": "nope_set", "check": {"not_null": ["nope"]}, "on_violation": "warn"}],
    )
    def a(ctx):
        return ctx.sql("select 1 as id")
run: true

files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    python_paths:
    - src
    - .
    targets:
      dev:
        engine:
          kind: memory
  models/m.py: |
    from pipeloom import model


    @model(
        expectations=[{"name": "one_row", "check": {"row_count": {"min": 1}}, "on_violation": "drop"}],
    )
    def a(ctx):
        return ctx.sql("select 1")

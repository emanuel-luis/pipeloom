files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    python_paths: [src, models]
    targets:
      dev:
        engine:
          kind: memory
  models/m.yml: |
    models:
      - name: a
        python: "m:a"
        inputs:
          x:
            ref: b
      - name: b
        sql: select 1
  src/m.py: |
    def a(ctx, y):
        return None
  models/p.py: |
    from pipeloom import model


    @model(inputs={"z": "b"})
    def c(ctx, *rest, b):
        return None


    @model
    def d(x, /, ctx):
        return None

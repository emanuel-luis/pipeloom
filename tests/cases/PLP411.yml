files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    python_paths: [src]
    targets:
      dev:
        engine: {kind: memory}
  models/m.yml: |
    models:
      - name: a
        sql: select 1 as x
        materialized: view
        expectations:
          - {name: x_set, check: {not_null: [x]}, on_violation: warn}

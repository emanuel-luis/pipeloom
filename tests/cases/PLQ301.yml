files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    python_paths: [src]
    targets:
      dev:
        engine:
          kind: memory
        catalog:
          kind: memory
        naming:
          kind: none
  models/m.yml: |
    models:
      - name: a
        sql: select 1 as id union all select null
        expectations:
          - name: id_set
            check:
              not_null: [id]
            on_violation: fail
run: true

files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    python_paths: [src]
    targets:
      dev:
        engine:
          kind: memory
        catalog:
          kind: memory
  models/m.yml: |
    models:
      - name: e
        sql: select 1 as id
        materialized: ephemeral
      - name: a
        python: "m:a"
        materialized: view
        inputs:
          e:
            ref: e
  src/m.py: |
    def a(ctx, e):
        return ctx.sql("select id from e")

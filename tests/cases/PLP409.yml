files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    python_paths:
    - src
    - .
    model_paths:
    - models
    - src
    targets:
      dev:
        engine:
          kind: memory
        catalog:
          kind: memory
  models/m.py: |
    from pipeloom import model


    @model(
        materialized="ephemeral",
    )
    def e(ctx):
        return ctx.sql("select 1 as id")
  src/m.py: |
    from pipeloom import model

    @model(
        materialized="view",
    )
    def a(ctx, e):
        return ctx.sql("select id from e")

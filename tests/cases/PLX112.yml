cli: [run, --state, "{project_dir}/state", --defer, -s, b]
setup:
  - [compile, --stable, --out, state/manifest.json]
files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    targets:
      dev:
        engine:
          kind: memory
        catalog:
          kind: memory
  models/m.py: |
    from pipeloom import model


    @model(
        materialized="intermediate",
    )
    def a(ctx):
        return ctx.sql("select 1 as x")


    @model
    def b(ctx, a):
        return ctx.sql("select * from a")

files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    targets:
      dev:
        engine:
          kind: memory
  models/m.py: |
    from pipeloom import model


    @model
    def a(ctx, b):
        return ctx.sql("select * from b")


    @model
    def b(ctx, c):
        return ctx.sql("select * from c")


    @model
    def c(ctx, a):
        return ctx.sql("select * from a")


    @model
    def d(ctx):
        return ctx.sql("select 1")

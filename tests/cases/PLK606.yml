files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    python_paths: [src]
    model_paths:
    - src
    targets:
      dev:
        engine:
          kind: nosql
  src/m.py: |
    from pipeloom import model

    @model
    def a(ctx):
        return ctx.sql("select 1 as id")
plugins: ["tests.plugins.fakes:NOSQL"]

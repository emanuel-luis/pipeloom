files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    python_paths: [src]
    sources:
      raw:
        tables:
          raw:
            table: main.raw
    model_paths:
    - src
    targets:
      dev:
        engine:
          kind: memory
          root: store
          tables:
            main.raw:
              - id: 1
        catalog:
          kind: memory
          root: store
        naming:
          kind: none
  src/shop/__init__.py: ""
  src/shop/hook.py: |
    """The model moves its own watermark while it runs, like a concurrent run would."""

    from pipeloom import model, source


    from datetime import UTC, datetime
    from pathlib import Path
    from typing import Any

    from pipeloom.state.sqlite import SqliteStore
    from pipeloom.state.types import StateKey, Watermark


    @model(
        inputs={"raw": source("raw", "raw")},
        materialized="incremental",
        incremental={"input": "raw", "column": "id"},
    )
    def a(ctx: Any, raw: Any) -> Any:
        root = Path(__file__).resolve().parents[2]
        moved = Watermark(99, "int64", "other", datetime(2026, 1, 1, tzinfo=UTC))
        SqliteStore(root / ".pipeloom" / "state.db").cas_watermark(
            StateKey("shop", "dev", "a"), None, moved
        )
        return raw
run: true

files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    python_paths:
    - src
    - .
    targets:
      dev:
        engine:
          kind: memory
        catalog:
          kind: memory
  models/m.py: |
    from pipeloom import model


    @model(
        columns=[{"name": "id", "dtype": "int64", "nullable": False}, {"name": "label", "dtype": "int64"}],
    )
    def a(ctx):
        return ctx.sql("select 1 as id, 'x' as label")
run: true

files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    python_paths: [src]
    targets:
      dev:
        engine:
          kind: memory
          root: store
          tables:
            main.a:
              - id: 1
        catalog:
          kind: memory
          root: store
        naming:
          kind: none
  models/m.yml: |
    models:
      - name: a
        sql: select 1 as id, 'x' as extra
        write:
          strategy: append
run: true

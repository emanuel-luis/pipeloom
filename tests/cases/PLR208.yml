files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    sources:
      raw:
        tables:
          raw:
            location: raw
    targets:
      dev:
        engine:
          kind: memory
  models/m.yml: |
    models:
    - name: a
      unit_tests:
      - name: wrong_alias
        given:
          source:
            rows:
            - id: 1
        expect:
          rows:
          - id: 1
      - name: wrong_alias
        given:
          src:
            rows:
            - id: 1
        expect:
          rows:
          - id: 1
  models/m.py: |
    from pipeloom import model, source


    @model(
        inputs={"src": source("raw", "raw")},
    )
    def a(ctx, src):
        return ctx.sql("select id from src")

files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    targets:
      dev:
        engine:
          kind: memory
  models/m.py: |
    from pipeloom import model, ref


    @model
    def stg_orders(ctx):
        return ctx.sql("select 1")


    @model(
        inputs={"orders": ref("stg_ordrs")},
    )
    def report(ctx, orders):
        return ctx.sql("select * from orders")

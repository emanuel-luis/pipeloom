entry_points:
  - group: commands
    name: databricks
    value: "pipeloom_databricks.cli:databricks"
    dist: pipeloom-databricks
    version: "0.3.0"
plugins: ["pipeloom_databricks.spec:RENDERER_SPEC"]
cli: [databricks, "--client-factory=pipeloom_databricks.testing.fake:empty", run, --target=prod, --ensure, --no-wait, --select=a]
files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    engine:
      kind: memory
    catalog:
      kind: memory
    state:
      kind: json
      path: /Volumes/main/ops/state
    artifacts:
      root: /Volumes/main/ops/pipeloom
    deploy:
      kind: databricks
      pipelines:
        main: {}
      task_grouping: by_tag
    targets:
      prod: {}
  models/m.py: |
    from pipeloom import model


    @model(
        tags=["g"],
    )
    def a(ctx):
        return ctx.sql("select 1 as x")


    @model(
        tags=["g"],
    )
    def b(ctx):
        return ctx.sql("select 2 as x")

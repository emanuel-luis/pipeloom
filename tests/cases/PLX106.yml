run: {boundary: task}
files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    python_paths: [src]
    targets:
      dev:
        engine: {kind: memory, root: store}
        catalog: {kind: memory, root: store}
        state: {kind: json, path: state}
  models/m.yml: |
    models:
      - {name: a, python: "m:die"}
  src/m.py: |
    def die(ctx):
        import os

        os._exit(3)

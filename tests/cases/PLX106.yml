run:
  boundary: task
files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    python_paths: [src]
    model_paths:
    - src
    targets:
      dev:
        engine:
          kind: memory
          root: store
        catalog:
          kind: memory
          root: store
        state:
          kind: json
          path: state
  src/m.py: |
    from pipeloom import model

    @model(
        name="a",
    )
    def die(ctx):
        import os

        os._exit(3)

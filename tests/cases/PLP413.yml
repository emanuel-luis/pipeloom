files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    python_paths:
    - src
    - .
    targets:
      dev:
        engine:
          kind: memory
        catalog:
          kind: memory
  models/m.py: |
    from pipeloom import model


    @model(
        materialized="intermediate",
        partition_by=["x"],
    )
    def a(ctx):
        return ctx.sql("select 1 as x")

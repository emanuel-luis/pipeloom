files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    python_paths:
    - src
    - .
    sources:
      raw:
        tables:
          raw:
            table: main.raw
    targets:
      dev:
        engine:
          kind: memory
          root: store
          tables:
            main.raw:
              - id: 1
        catalog:
          kind: memory
          root: store
        naming:
          kind: none
  models/m.py: |
    from pipeloom import model, source


    @model(
        inputs={"raw": source("raw", "raw")},
        materialized="incremental",
        incremental={"input": "raw", "column": "updated_at"},
    )
    def a(ctx, raw):
        return ctx.sql("select id from raw")
run: true

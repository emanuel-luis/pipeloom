files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    targets:
      dev:
        engine:
          kind: memory
  models/m.py: |
    from pipeloom import model, ref


    @model(
        inputs={"me": ref("loop")},
    )
    def loop(ctx, me):
        return ctx.sql("select * from me")

cli:
  - test
files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    sources:
      raw:
        tables:
          raw:
            location: raw
    targets:
      dev:
        engine:
          kind: memory
        catalog:
          kind: memory
  models/m.yml: |
    models:
    - name: a
      unit_tests:
      - name: upper_labels
        given:
          src:
            rows:
            - id: 1
              label: x
            - id: 2
              label: y
        expect:
          rows:
          - id: 1
            label: X
          - id: 2
            label: Z
  models/m.py: |
    from pipeloom import model, source


    @model(
        inputs={"src": source("raw", "raw")},
    )
    def a(ctx, src):
        return ctx.sql("select id, upper(label) as label from src")

files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    python_paths:
    - src
    - .
    targets:
      dev:
        engine:
          kind: memory
  models/m.py: |
    from pipeloom import model


    @model(
        write={"strategy": "scd2", "unique_key": ["id"]},
    )
    def a(ctx):
        return ctx.sql("select 1")

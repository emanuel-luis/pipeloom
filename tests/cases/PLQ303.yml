files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    targets:
      dev:
        engine:
          kind: memory
        catalog:
          kind: memory
        naming:
          kind: none
  models/m.py: |
    from pipeloom import model


    @model(
        data_tests=[{"name": "id_set", "check": {"not_null": ["id"]}, "on_violation": "fail"}],
    )
    def a(ctx):
        return ctx.sql("select 1 as id union all select null")
run:
  data_tests: true

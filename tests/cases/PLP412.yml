files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    python_paths:
    - src
    - .
    targets:
      dev:
        engine:
          kind: memory
  models/m.py: |
    from pipeloom import model


    @model(
        quality={"quarantine": True},
        expectations=[{"name": "x_set", "check": {"not_null": ["x"]}, "on_violation": "drop"}],
    )
    def a(ctx):
        return ctx.sql("select 1 as x")


    @model
    def a__quarantine(ctx):
        return ctx.sql("select 1 as x")

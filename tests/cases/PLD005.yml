plugins: ["pipeloom_databricks.spec:RENDERER_SPEC"]
render:
  pipeline: main
files:
  pipeloom.yml: |
    config_version: 1
    name: shop
    engine:
      kind: memory
    catalog:
      kind: memory
    deploy:
      kind: databricks
      compute_rules:
        - select: ["tag:heavy"]
          compute: default
    targets:
      dev: {}
  models/m.yml: |
    models:
      - name: a
        sql: select 1 as x

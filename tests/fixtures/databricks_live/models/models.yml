models:
  - name: a
    tags: [stable]
    sql: select 1 as id, 'a' as label
  - name: b
    tags: [stable]
    sql: select id, label, id + 1 as next_id from a
    inputs:
      a:
        ref: a
  # Fails on attempt 1 only: the live workflow repairs it and expects attempt 2 to succeed.
  - name: c
    tags: [flaky]
    python: live.models:flaky
    inputs:
      a:
        ref: a

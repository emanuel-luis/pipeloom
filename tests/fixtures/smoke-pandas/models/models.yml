models:
  - name: stg_customers
    python: smoke.models:stg_customers
    inputs: {raw_customers: {source: raw_customers}}
  - name: stg_orders
    python: smoke.models:stg_orders
    inputs: {raw_orders: {source: raw_orders}}
  - name: orders_enriched
    materialized: ephemeral
    python: smoke.models:orders_enriched
    inputs:
      orders: {ref: stg_orders}
      customers: {ref: stg_customers}
  - name: fct_orders
    python: smoke.models:fct_orders
    frame_api: narwhals
    write: {strategy: append}
    inputs:
      enriched: {ref: orders_enriched}
  - name: dim_customers
    python: smoke.models:dim_customers
    inputs:
      enriched: {ref: orders_enriched}
  - name: rpt_revenue
    python: smoke.models:rpt_revenue
    inputs: {fct_orders: {ref: fct_orders}}

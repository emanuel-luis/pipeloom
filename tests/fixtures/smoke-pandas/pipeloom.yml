config_version: 1
name: smoke_pandas
python_paths: [src]
models:
  +materialized: table
sources:
  raw:
    tables:
      raw_customers:
        format: csv
        location: raw/customers.csv
      raw_orders:
        format: csv
        location: raw/orders.csv
model_paths:
- src
targets:
  pandas:
    engine:
      kind: pandas
    catalog:
      kind: filesystem
      root: target/warehouse
    state:
      kind: json
      path: .pipeloom/state
    naming:
      kind: none

config_version: 1
name: shop
python_paths: [models]
engine:
  kind: memory
catalog:
  kind: memory
models:
  +materialized: table
  staging:
    +tags: [staging]
sources:
  raw:
    tables:
      raw_customers:
        format: memory
        location: raw/customers
      raw_orders:
        format: memory
        location: raw/orders
      raw_payments:
        format: memory
        location: raw/payments
targets:
  dev:
    naming:
      kind: per_user
  ci:
    naming:
      kind: none

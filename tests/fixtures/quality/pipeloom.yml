config_version: 1
name: quality
python_paths: [src]
models:
  +materialized: table
sources:
  raw:
    tables:
      raw_orders:
        format: csv
        location: raw/orders.csv
model_paths:
- src
targets:
  polars:
    engine:
      kind: polars
    catalog:
      kind: filesystem
      root: target/warehouse
      format: parquet
    state:
      kind: json
      path: .pipeloom/state
    naming:
      kind: none
  pandas:
    engine:
      kind: pandas
    catalog:
      kind: filesystem
      root: target/warehouse
      format: parquet
    state:
      kind: json
      path: .pipeloom/state
    naming:
      kind: none
  memory:
    engine:
      kind: memory
    catalog:
      kind: memory
      root: store
    state:
      kind: json
      path: .pipeloom/state
    naming:
      kind: none

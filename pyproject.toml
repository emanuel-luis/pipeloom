[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipeloom"
version = "0.0.1"
description = "Declarative, engine-agnostic data pipelines in YAML."
readme = "README.pypi.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Emanuel Luis", email = "emanuel.filho08@gmail.com" }]
keywords = ["data-engineering", "pipelines", "yaml", "declarative", "etl", "orchestration"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["click>=8.1"]

[project.urls]
Repository = "https://github.com/emanuel-luis/pipeloom"
Documentation = "https://emanuel-luis.github.io/pipeloom/"
Changelog = "https://github.com/emanuel-luis/pipeloom/blob/main/CHANGELOG.md"

[project.scripts]
pipeloom = "pipeloom.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-cov", "mypy", "ruff", "pre-commit"]
docs = ["mkdocs-material", "mkdocstrings[python]", "mkdocs-click", "mike"]

[tool.hatch.build.targets.wheel]
packages = ["src/pipeloom"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "CHANGELOG.md"]

[tool.ruff]
extend-exclude = ["docs"]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["BLE", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

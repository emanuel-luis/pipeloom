[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipeloom"
version = "0.3.0"
description = "Declarative, engine-agnostic data pipelines in YAML."
readme = "README.pypi.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Emanuel Luis", email = "emanuel.filho08@gmail.com" }]
keywords = ["data-engineering", "pipelines", "yaml", "declarative", "etl", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.2",
    "narwhals>=2.0",
    "pydantic>=2.12",
    "pyyaml>=6.0.2",
    "rich>=13.7",
]

[project.optional-dependencies]
polars = ["pipeloom-polars==0.3.0"]
pandas = ["pipeloom-pandas==0.3.0"]
spark = ["pipeloom-spark[local]==0.3.0"]
databricks = ["pipeloom-databricks==0.3.0"]
airflow = ["pipeloom-airflow==0.3.0"]
sqlglot = ["sqlglot>=26"]

[project.urls]
Repository = "https://github.com/emanuel-luis/pipeloom"
Documentation = "https://emanuel-luis.github.io/pipeloom/"
Changelog = "https://github.com/emanuel-luis/pipeloom/blob/main/CHANGELOG.md"

[project.scripts]
pipeloom = "pipeloom.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "ruff",
    "pre-commit",
    "hypothesis>=6.170.14",
    "pytest-timeout>=2.4.0",
    "types-pyyaml>=6.0.12.20261103",
    "jsonschema>=4.26.0",
    "import-linter>=2.15",
    "polars>=2.1.0",
    "pandas>=3.1.0",
    "pyarrow>=26.0.1",
    "sqlglot>=26",
]
spark = ["pipeloom-spark[local]"]
# Airflow does not support Windows: install this group on Linux, macOS or WSL only.
airflow = ["apache-airflow>=3.2,<4", "apache-airflow-providers-cncf-kubernetes>=10.25,<11"]
docs = ["mkdocs-material", "mkdocstrings[python]", "mkdocs-click", "mike"]

[tool.uv.workspace]
members = ["plugins/*"]

[tool.uv.sources]
pipeloom-polars = { workspace = true }
pipeloom-pandas = { workspace = true }
pipeloom-spark = { workspace = true }
pipeloom-databricks = { workspace = true }
pipeloom-airflow = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/pipeloom"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "CHANGELOG.md"]

[tool.ruff]
extend-exclude = ["docs"]
line-length = 100
src = [
    "src",
    "tests",
    "plugins/pipeloom-polars/src",
    "plugins/pipeloom-pandas/src",
    "plugins/pipeloom-spark/src",
    "plugins/pipeloom-databricks/src",
    "plugins/pipeloom-airflow/src",
]

[tool.ruff.lint]
extend-select = ["BLE", "I", "UP", "B"]

[tool.mypy]
strict = true
files = [
    "src",
    "tests",
    "plugins/pipeloom-polars/src",
    "plugins/pipeloom-polars/tests",
    "plugins/pipeloom-pandas/src",
    "plugins/pipeloom-pandas/tests",
    "plugins/pipeloom-spark/src",
    "plugins/pipeloom-spark/tests",
    "plugins/pipeloom-databricks/src",
    "plugins/pipeloom-databricks/tests",
    "plugins/pipeloom-airflow/src",
    "plugins/pipeloom-airflow/tests",
]

[[tool.mypy.overrides]]
# pyspark is not installed by the default environment (only by the `spark` group).
module = ["pandas", "pandas.*", "pyarrow", "pyarrow.*", "pyspark", "pyspark.*", "delta", "delta.*", "py4j", "py4j.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Airflow is installed only by the `airflow` group (never on Windows). Without it the Airflow base
# classes are Any, so the modules that subclass them allow that; with it they check fully.
module = ["airflow", "airflow.*", "kubernetes", "kubernetes.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pipeloom_airflow.dag",
    "pipeloom_airflow.operators.*",
    "pipeloom_airflow._compat",
    "pipeloom_airflow._compat_k8s",
]
disallow_subclassing_any = false

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
timeout = 60
testpaths = ["tests", "plugins/pipeloom-polars/tests", "plugins/pipeloom-pandas/tests", "plugins/pipeloom-spark/tests", "plugins/pipeloom-databricks/tests", "plugins/pipeloom-airflow/tests"]
pythonpath = ["."]
markers = [
    "spark: needs local Spark (PIPELOOM_TEST_SPARK=classic, Linux or macOS, Java)",
    "spark_connect: needs a local Spark Connect server (PIPELOOM_TEST_SPARK=connect)",
    "airflow_e2e: migrates a throwaway sqlite Airflow database and runs dag.test() (PIPELOOM_TEST_AIRFLOW=1)",
]

[tool.coverage.run]
# Directories, never package names: for a package name coverage imports it inside
# `sys_modules_saved()` whenever `sys.path` changes (CallableLoader does, once per run) and then
# deletes every module imported meanwhile, which breaks imports in flight on the worker threads.
source = [
  "src/pipeloom",
  "plugins/pipeloom-polars/src/pipeloom_polars",
  "plugins/pipeloom-pandas/src/pipeloom_pandas",
  "plugins/pipeloom-spark/src/pipeloom_spark",
  "plugins/pipeloom-databricks/src/pipeloom_databricks",
  "plugins/pipeloom-airflow/src/pipeloom_airflow",
]

[tool.importlinter]
root_packages = ["pipeloom", "pipeloom_databricks", "pipeloom_airflow"]
include_external_packages = true
exclude_type_checking_imports = true

# Top to bottom. A layer may import the ones below it. `:` marks siblings that import each other
# today (config, secrets and events form a cycle in 0.1). `pipeloom.runtime` is listed before the
# scheduler lands; `pipeloom.artifacts` joins the `state` layer with the PR that creates it
# (import-linter rejects a layer whose module does not exist). Imports under TYPE_CHECKING are
# ignored, so protocols may name runtime types in signatures. `pipeloom.testing` is outside the
# layers: it may import anything, and the second contract keeps the rest from importing it.
[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
    "pipeloom.cli",
    "pipeloom.api",
    "pipeloom.runtime",
    "pipeloom.artifacts | pipeloom.state | pipeloom.builtins",
    "pipeloom.plan",
    "pipeloom.validate",
    "pipeloom.graph",
    "pipeloom.config : pipeloom.secrets : pipeloom.events",
    "pipeloom.plugins",
    "pipeloom.engine",
    "pipeloom.diagnostics | pipeloom.platform",
]
exhaustive = false

[[tool.importlinter.contracts]]
name = "Only pipeloom.testing imports pipeloom.testing"
type = "forbidden"
# Every top-level module except testing: with `pipeloom` as the source, testing would be one too.
source_modules = [
    "pipeloom.__main__",
    "pipeloom.api",
    "pipeloom.artifacts",
    "pipeloom.builtins",
    "pipeloom.cli",
    "pipeloom.config",
    "pipeloom.diagnostics",
    "pipeloom.engine",
    "pipeloom.events",
    "pipeloom.graph",
    "pipeloom.plan",
    "pipeloom.platform",
    "pipeloom.plugins",
    "pipeloom.runtime",
    "pipeloom.secrets",
    "pipeloom.state",
    "pipeloom.validate",
]
forbidden_modules = ["pipeloom.testing"]

[[tool.importlinter.contracts]]
name = "No dataframe or SQL parsing library in the core"
type = "forbidden"
source_modules = ["pipeloom"]
forbidden_modules = ["polars", "pandas", "pyarrow", "sqlglot", "pyspark", "delta", "py4j"]
ignore_imports = ["pipeloom.validate.static -> sqlglot"]

[[tool.importlinter.contracts]]
name = "The core never imports the Databricks plugin or SDK"
type = "forbidden"
source_modules = ["pipeloom"]
forbidden_modules = ["pipeloom_databricks", "databricks"]

# Only the modules that talk to a workspace may import the SDK. They arrive with the client
# (PR32) and the task wrapper (PR31), so an ignored import that matches nothing is fine for now.
[[tool.importlinter.contracts]]
name = "Only the client and task value modules import databricks.sdk"
type = "forbidden"
source_modules = ["pipeloom_databricks"]
forbidden_modules = ["databricks"]
ignore_imports = [
    "pipeloom_databricks.client.sdk -> databricks",
    "pipeloom_databricks.client.connect -> databricks",
    "pipeloom_databricks.task_values -> databricks",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "The core never imports the Airflow plugin or Airflow"
type = "forbidden"
source_modules = ["pipeloom"]
forbidden_modules = ["pipeloom_airflow", "airflow"]

# Only the compat seam imports Airflow. It arrives with the DAG classes (PR37), so an ignored
# import that matches nothing is fine for now. The subprocess test in test_import.py backs this
# contract, because indirect imports are allowed here.
[[tool.importlinter.contracts]]
name = "Only the compat modules import airflow, kubernetes or databricks.sdk"
type = "forbidden"
source_modules = ["pipeloom_airflow"]
forbidden_modules = ["airflow", "kubernetes", "databricks"]
allow_indirect_imports = true
ignore_imports = [
    "pipeloom_airflow._compat -> airflow",
    "pipeloom_airflow._compat_k8s -> airflow",
    "pipeloom_airflow._compat_k8s -> kubernetes",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Only pipeloom.engine.portable imports narwhals"
type = "forbidden"
source_modules = ["pipeloom"]
forbidden_modules = ["narwhals"]
ignore_imports = ["pipeloom.engine.portable -> narwhals"]

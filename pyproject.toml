[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipeloom"
version = "0.1.0"
description = "Declarative, engine-agnostic data pipelines in YAML."
readme = "README.pypi.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Emanuel Luis", email = "emanuel.filho08@gmail.com" }]
keywords = ["data-engineering", "pipelines", "yaml", "declarative", "etl", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.2",
    "narwhals>=2.0",
    "pydantic>=2.12",
    "pyyaml>=6.0.2",
    "rich>=13.7",
]

[project.urls]
Repository = "https://github.com/emanuel-luis/pipeloom"
Documentation = "https://emanuel-luis.github.io/pipeloom/"
Changelog = "https://github.com/emanuel-luis/pipeloom/blob/main/CHANGELOG.md"

[project.scripts]
pipeloom = "pipeloom.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "ruff",
    "pre-commit",
    "hypothesis>=6.170.14",
    "pytest-timeout>=2.4.0",
    "types-pyyaml>=6.0.12.20261103",
    "jsonschema>=4.26.0",
    "import-linter>=2.15",
    "polars>=2.1.0",
    "pandas>=3.1.0",
    "pyarrow>=26.0.1",
]
docs = ["mkdocs-material", "mkdocstrings[python]", "mkdocs-click", "mike"]

[tool.hatch.build.targets.wheel]
packages = ["src/pipeloom"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "CHANGELOG.md"]

[tool.ruff]
extend-exclude = ["docs"]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["BLE", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
timeout = 60
testpaths = ["tests"]

[tool.importlinter]
root_package = "pipeloom"
include_external_packages = true

# Top to bottom. A layer may import the ones below it. `:` marks siblings that import each other
# today (config, secrets and events form a cycle in 0.1). `pipeloom.runtime` is listed before the
# scheduler lands; `pipeloom.artifacts` joins the `state` layer with the PR that creates it
# (import-linter rejects a layer whose module does not exist). `pipeloom.testing` is outside the
# layers: it may import anything, and the second contract keeps the rest from importing it.
[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
    "pipeloom.cli",
    "pipeloom.api",
    "pipeloom.runtime",
    "pipeloom.state | pipeloom.builtins",
    "pipeloom.plan",
    "pipeloom.validate",
    "pipeloom.graph",
    "pipeloom.config : pipeloom.secrets : pipeloom.events",
    "pipeloom.plugins",
    "pipeloom.engine",
    "pipeloom.diagnostics | pipeloom.platform",
]
exhaustive = false
# RuntimeContext is a plain dataclass in engine protocol signatures. Moving it into
# pipeloom.engine is the clean fix; until then this one upward edge is allowed.
ignore_imports = ["pipeloom.engine.protocols -> pipeloom.runtime.context"]

[[tool.importlinter.contracts]]
name = "Only pipeloom.testing imports pipeloom.testing"
type = "forbidden"
# Every top-level module except testing: with `pipeloom` as the source, testing would be one too.
source_modules = [
    "pipeloom.__main__",
    "pipeloom.api",
    "pipeloom.builtins",
    "pipeloom.cli",
    "pipeloom.config",
    "pipeloom.diagnostics",
    "pipeloom.engine",
    "pipeloom.events",
    "pipeloom.graph",
    "pipeloom.plan",
    "pipeloom.platform",
    "pipeloom.plugins",
    "pipeloom.runtime",
    "pipeloom.secrets",
    "pipeloom.state",
    "pipeloom.validate",
]
forbidden_modules = ["pipeloom.testing"]

[[tool.importlinter.contracts]]
name = "No dataframe or SQL parsing library in the core"
type = "forbidden"
source_modules = ["pipeloom"]
forbidden_modules = ["polars", "pandas", "pyarrow", "sqlglot"]

[[tool.importlinter.contracts]]
name = "Only pipeloom.engine.portable imports narwhals"
type = "forbidden"
source_modules = ["pipeloom"]
forbidden_modules = ["narwhals"]
ignore_imports = ["pipeloom.engine.portable -> narwhals"]

site_name: pipeloom
site_description: "Engine-agnostic data pipelines: Python models marked with @model, YAML for the project."
site_url: https://emanuel-luis.github.io/pipeloom/latest/
repo_url: https://github.com/emanuel-luis/pipeloom
docs_dir: docs
exclude_docs: |
  diagrams/*.d2
validation:
  anchors: warn
theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - search.suggest
    - search.highlight
extra_css:
  - stylesheets/extra.css
edit_uri: edit/main/docs/
extra:
  version:
    provider: mike
    default: latest
hooks:
  - tools/docs_hooks.py
plugins:
  - search
  - glightbox
  - mkdocstrings
markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
  - mkdocs-click
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Examples:
      - examples/index.md
      - Late-arriving events: examples/events_incremental.md
      - Customer dimension with history: examples/customers_scd2.md
      - An untrusted partner feed: examples/orders_quality.md
      - Testing transformation logic: examples/tested-models.md
  - Guide:
      - Running a pipeline: guide/running.md
      - Incremental models: guide/incremental.md
      - Merge, replace_partitions, scd2 and schema changes: guide/write-strategies.md
      - Data quality: guide/quality.md
      - Testing models: guide/testing.md
      - Portable models: guide/portable-models.md
      - Retries, timeouts and cancellation: guide/retries-and-cancellation.md
      - Docs site: guide/docs-site.md
      - Run history: guide/run-history.md
      - Table diff: guide/table-diff.md
      - Alerts with the webhook sink: guide/alerts.md
      - Migrating from 0.8: guide/migrate-0.9.md
      - Lineage with OpenLineage: guide/openlineage.md
      - Orchestrator protocol: guide/orchestrators.md
      - "Recipe: GitHub Actions": guide/recipe-github-actions.md
  - Plugins:
      - Polars: plugins/polars.md
      - pandas: plugins/pandas.md
      - DuckDB: plugins/duckdb.md
      - Spark: plugins/spark.md
      - Databricks: plugins/databricks.md
      - Airflow: plugins/airflow.md
      - Writing an engine: plugins/writing-an-engine.md
  - Reference:
      - Command line: reference/cli.md
      - Databricks commands: reference/databricks-cli.md
      - JSON Schema: reference/schema.md
      - Run artifacts: reference/artifacts.md
      - Error codes: reference/errors.md
      - Engine capabilities: reference/engine-capabilities.md
      - Stability and deprecations: reference/stability.md
  - Architecture: architecture.md
  - Roadmap: roadmap.md
  - Market landscape: landscape.md
  - Decisions: adr/README.md

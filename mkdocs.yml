site_name: pipeloom
site_description: Declarative, engine-agnostic data pipelines in YAML.
site_url: https://emanuel-luis.github.io/pipeloom/
repo_url: https://github.com/emanuel-luis/pipeloom
docs_dir: docs
exclude_docs: |
  diagrams/*.d2
theme:
  name: material
hooks:
  - tools/docs_hooks.py
plugins:
  - search
  - mkdocstrings
markdown_extensions:
  - attr_list
  - tables
  - admonition
  - toc:
      permalink: true
  - mkdocs-click
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Plugins:
      - Polars: plugins/polars.md
      - pandas: plugins/pandas.md
  - Reference:
      - Command line: reference/cli.md
      - JSON Schema: reference/schema.md
      - Error codes: reference/errors.md
  - Architecture: architecture.md
  - Decisions: adr/README.md

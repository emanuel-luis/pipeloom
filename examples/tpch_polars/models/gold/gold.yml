# yaml-language-server: $schema=https://emanuel-luis.github.io/pipeloom/latest/schema/v1/models.json
# Gold: two reports built from the silver tables.
models:
  - name: revenue_by_region_month
    sql: |
      select
        o.region as region,
        o.nation as nation,
        extract(year from o.order_date) as order_year,
        extract(month from o.order_date) as order_month,
        count(distinct o.order_key) as orders,
        round(sum(l.net_revenue), 2) as net_revenue
      from orders_enriched o
      join lineitem_revenue l on o.order_key = l.order_key
      group by
        o.region,
        o.nation,
        extract(year from o.order_date),
        extract(month from o.order_date)
    inputs:
      orders_enriched: {ref: orders_enriched}
      lineitem_revenue: {ref: lineitem_revenue}
    tags: [gold]
    expectations:
      - {name: not_empty, check: {row_count: {min: 1}}, on_violation: fail}
  - name: top_customers
    sql: |
      select
        o.customer_key as customer_key,
        o.customer_name as customer_name,
        o.nation as nation,
        o.region as region,
        count(distinct o.order_key) as orders,
        round(sum(l.net_revenue), 2) as net_revenue
      from orders_enriched o
      join lineitem_revenue l on o.order_key = l.order_key
      group by o.customer_key, o.customer_name, o.nation, o.region
      order by net_revenue desc, customer_key
      limit 10
    inputs:
      orders_enriched: {ref: orders_enriched}
      lineitem_revenue: {ref: lineitem_revenue}
    tags: [gold]
    expectations:
      - {name: not_empty, check: {row_count: {min: 1}}, on_violation: fail}

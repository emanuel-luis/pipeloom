# yaml-language-server: $schema=https://emanuel-luis.github.io/pipeloom/latest/schema/v1/project.json
config_version: 1
name: tpch_polars
vars:
  tpch_dir: ../data/tpch
models:
  +materialized: table
  # The queries are written for polars, whose SQL follows PostgreSQL. Declaring it lets the
  # duckdb target translate them (needs pipeloom[sqlglot]).
  +sql_dialect: postgres
  bronze:
    +catalog: pipeloom_bronze
    +tags: [bronze]
  silver:
    +catalog: pipeloom_silver
    +tags: [silver]
  gold:
    +catalog: pipeloom_gold
    +tags: [gold]
sources:
  tpch:
    format: parquet
    location: ${var:tpch_dir}
    tables:
      orders:
        location: orders.parquet
      lineitem:
        location: lineitem.parquet
      customer:
        location: customer.parquet
      nation:
        location: nation.parquet
      region:
        location: region.parquet
targets:
  dev:
    engine:
      kind: polars
    catalog:
      kind: filesystem
      root: target/warehouse
    naming:
      kind: none
      schema: tpch
    state:
      kind: json
      path: .pipeloom/state
  duckdb:
    engine:
      kind: duckdb
    catalog:
      kind: duckdb
      path: target/duckdb/tpch.duckdb
    naming:
      kind: none
      schema: tpch
    state:
      kind: json
      path: .pipeloom/state-duckdb

# Marquez, the OpenLineage reference backend, for tools/marquez_check.py (ADR-0046).
# docker compose -p pipeloom-marquez -f examples/marquez/compose.yml up -d --wait
# API on http://localhost:15000, admin on 15001, web UI on http://localhost:13000. Postgres has
# no host port. The database password is a throwaway local default, not a secret.
name: pipeloom-marquez

services:
  db:
    image: postgres:14.13
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U marquez -d marquez
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db:/var/lib/postgresql/data

  api:
    image: marquezproject/marquez:0.50.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      MARQUEZ_PORT: "5000"
      MARQUEZ_ADMIN_PORT: "5001"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
    ports:
      - "15000:5000"
      - "15001:5001"

  web:
    image: marquezproject/marquez-web:0.50.0
    depends_on:
      - api
    environment:
      MARQUEZ_HOST: api
      MARQUEZ_PORT: "5000"
      WEB_PORT: "3000"
    ports:
      - "13000:3000"

volumes:
  db:

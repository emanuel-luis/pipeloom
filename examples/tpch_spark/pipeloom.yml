# yaml-language-server: $schema=https://emanuel-luis.github.io/pipeloom/latest/schema/v1/project.json
# Needs Java 17 or 21, so it runs on Linux, WSL or in a container, never in Windows Python.
config_version: 1
name: tpch_spark
vars:
  tpch_dir: ../data/tpch
defaults:
  models:
    materialized: table
targets:
  dev:
    engine:
      kind: spark
      mode: local
    catalog:
      kind: delta_path
      root: target/warehouse
    naming:
      kind: none
      schema: tpch
    state:
      kind: json
      path: .pipeloom/state

# yaml-language-server: $schema=https://emanuel-luis.github.io/pipeloom/latest/schema/v1/project.json
# Needs Java 17 or 21, so it runs on Linux, WSL or in a container, never in Windows Python.
config_version: 1
name: tpch_spark
vars:
  tpch_dir: ../data/tpch
models:
  +materialized: table
  bronze:
    +catalog: pipeloom_bronze
    +tags: [bronze]
  silver:
    +catalog: pipeloom_silver
    +tags: [silver]
  gold:
    +catalog: pipeloom_gold
    +tags: [gold]
sources:
  tpch:
    format: parquet
    location: ${var:tpch_dir}
    tables:
      orders:
        location: orders.parquet
      lineitem:
        location: lineitem.parquet
      customer:
        location: customer.parquet
      nation:
        location: nation.parquet
      region:
        location: region.parquet
targets:
  dev:
    engine:
      kind: spark
      mode: local
    catalog:
      kind: delta_path
      root: target/warehouse
    naming:
      kind: none
      schema: tpch
    state:
      kind: json
      path: .pipeloom/state

# yaml-language-server: $schema=https://emanuel-luis.github.io/pipeloom/latest/schema/v1/project.json
# Runs as a Databricks job on serverless compute. The catalogs, the ops schema and the artifacts
# volume must exist before the first deploy.
config_version: 1
name: tpch_databricks
defaults:
  models: {materialized: table}
targets:
  dev:
    engine: {kind: spark}
    catalog: {kind: unity, catalog: pipeloom_bronze}
    naming: {kind: none, schema: tpch}
    state: {kind: table, table: pipeloom_bronze.ops._pipeloom_state_tpch}
    artifacts: {root: /Volumes/pipeloom_bronze/ops/artifacts/tpch}
    deploy:
      kind: databricks
      compute:
        default:
          kind: serverless
          environment_version: "5"
          dependencies:
            - "pipeloom==0.7.0"
            - "pipeloom-spark==0.7.0"
            - "pipeloom-databricks==0.7.0"

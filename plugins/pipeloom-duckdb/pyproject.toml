[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipeloom-duckdb"
version = "1.1.0"
description = "DuckDB engine for pipeloom: SQL pushdown, a database file catalog, Parquet, CSV and Delta reads."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Emanuel Luis", email = "emanuel.filho08@gmail.com" }]
keywords = ["pipeloom", "duckdb", "data-engineering", "pipelines"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["pipeloom~=1.1.0", "duckdb>=1.4,<3"]

[project.urls]
Repository = "https://github.com/emanuel-luis/pipeloom"
Documentation = "https://emanuel-luis.github.io/pipeloom/"
Changelog = "https://github.com/emanuel-luis/pipeloom/blob/main/CHANGELOG.md"

[project.entry-points."pipeloom.engines"]
duckdb = "pipeloom_duckdb.spec:ENGINE_SPEC"

[project.entry-points."pipeloom.catalogs"]
duckdb = "pipeloom_duckdb.spec:CATALOG_SPEC"

[tool.uv.sources]
pipeloom = { workspace = true }

[tool.pipeloom]
config-version = 1
plugin-api = "1.0"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeloom_duckdb"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "LICENSE", "NOTICE", "README.md"]

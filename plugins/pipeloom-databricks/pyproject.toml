[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipeloom-databricks"
version = "0.3.0"
description = "Databricks renderer for pipeloom: a compiled plan as Jobs settings JSON and bundle YAML."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Emanuel Luis", email = "emanuel.filho08@gmail.com" }]
keywords = ["pipeloom", "databricks", "jobs", "bundles", "data-engineering", "pipelines"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["pipeloom~=0.3.0", "pipeloom-spark~=0.3.0", "databricks-sdk>=0.50,<1"]

[project.urls]
Repository = "https://github.com/emanuel-luis/pipeloom"
Documentation = "https://emanuel-luis.github.io/pipeloom/"
Changelog = "https://github.com/emanuel-luis/pipeloom/blob/main/CHANGELOG.md"

[project.entry-points."pipeloom.renderers"]
databricks = "pipeloom_databricks.spec:RENDERER_SPEC"

[project.entry-points."pipeloom.catalogs"]
unity = "pipeloom_databricks.spec:UNITY_SPEC"

[project.entry-points."pipeloom.secret_providers"]
databricks = "pipeloom_databricks.spec:SECRETS_SPEC"

[project.entry-points."pipeloom.commands"]
databricks = "pipeloom_databricks.cli:databricks"

[project.scripts]
pipeloom_databricks_task = "pipeloom_databricks.task:main"

[tool.uv.sources]
pipeloom = { workspace = true }
pipeloom-spark = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/pipeloom_databricks"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "LICENSE", "NOTICE", "README.md"]

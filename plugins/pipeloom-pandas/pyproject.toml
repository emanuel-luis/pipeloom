[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipeloom-pandas"
version = "0.2.0"
description = "pandas engine for pipeloom: eager DataFrames and file tables."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Emanuel Luis", email = "emanuel.filho08@gmail.com" }]
keywords = ["pipeloom", "pandas", "data-engineering", "pipelines"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["pipeloom~=0.2.0", "pandas>=2.3.3,<4", "pyarrow>=22"]

[project.urls]
Repository = "https://github.com/emanuel-luis/pipeloom"
Documentation = "https://emanuel-luis.github.io/pipeloom/"
Changelog = "https://github.com/emanuel-luis/pipeloom/blob/main/CHANGELOG.md"

[project.entry-points."pipeloom.engines"]
pandas = "pipeloom_pandas.spec:SPEC"

[tool.uv.sources]
pipeloom = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/pipeloom_pandas"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "LICENSE", "NOTICE", "README.md"]
